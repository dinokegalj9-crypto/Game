[/Script/Engine.InputSettings]
; The Hollow Crown uses Enhanced Input. These legacy bindings exist as a
; fallback and to document the intended control scheme. Production input is
; driven by Input Mapping Contexts and Input Actions under /Game/Input.
bAltEnterTogglesFullscreen=True
bEnableGestureRecognizer=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; --- Documented control scheme (gamepad / keyboard) ---
; Move            : Left Stick / WASD
; Look            : Right Stick / Mouse
; Light Attack    : RB / Left Mouse
; Heavy Attack    : RT / Right Mouse
; Block / Parry   : LB / Q
; Dodge / Roll    : B / Space
; Sprint          : L3 / Left Shift
; Interact        : Y / E
; Lock On         : R3 / Middle Mouse
; Use Item        : X / R
; Open Inventory  : D-Pad Up / I
; Open Map        : D-Pad Down / M
